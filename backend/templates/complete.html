<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Huddle - Complete Chore</title>
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-card: #242424;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --accent-keiran: #4ecdc4;
            --accent-ciara: #ff6b9d;
            --accent-tahni: #4caf50;
            --success: #4ecdc4;
            --border-radius: 16px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .chore-name {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .prompt {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 32px;
        }

        .person-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .person-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .person-btn:active {
            transform: scale(0.98);
        }

        .person-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .person-btn.keiran {
            background: rgba(78, 205, 196, 0.2);
            color: var(--accent-keiran);
        }

        .person-btn.keiran:hover:not(:disabled) {
            background: rgba(78, 205, 196, 0.3);
        }

        .person-btn.ciara {
            background: rgba(255, 107, 157, 0.2);
            color: var(--accent-ciara);
        }

        .person-btn.ciara:hover:not(:disabled) {
            background: rgba(255, 107, 157, 0.3);
        }

        .person-btn.tahni {
            background: rgba(255, 217, 61, 0.2);
            color: var(--accent-tahni);
        }

        .person-btn.tahni:hover:not(:disabled) {
            background: rgba(255, 217, 61, 0.3);
        }

        .person-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Success state */
        .success-view {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: popIn 0.4s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(78, 205, 196, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            color: var(--success);
        }

        .success-message {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .success-sub {
            color: var(--text-secondary);
        }

        .close-hint {
            margin-top: 32px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .admin-link {
            margin-top: 24px;
        }

        .admin-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .admin-link a:hover {
            background: #2a2a2a;
            color: var(--text-primary);
        }

        .admin-link svg {
            width: 16px;
            height: 16px;
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error state */
        .error-message {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 16px;
            border-radius: var(--border-radius);
            margin-top: 16px;
            display: none;
        }

        /* Skip button */
        .skip-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #333;
        }

        .skip-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .skip-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #444;
            border-radius: var(--border-radius);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .skip-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
            border-color: #666;
            color: var(--text-primary);
        }

        .skip-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .skip-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .skip-btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-link" style="margin-bottom: 24px;">
            <a href="#" onclick="goBack(); return false;" style="display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Chores
            </a>
        </div>

        <div id="selectView">
            <h1 class="chore-name">{{ chore.name }}</h1>
            <p class="prompt">Who completed this?</p>
            
            <div class="person-buttons">
                {% for person in people %}
                <button class="person-btn {{ person.lower() }}" onclick="complete('{{ person }}')" id="btn-{{ person }}">
                    <span class="person-dot"></span>
                    {{ person }}
                </button>
                {% endfor %}
            </div>
            
            <div class="error-message" id="errorMessage"></div>

            <div class="skip-section">
                <div class="skip-label">Not doing this today?</div>
                <button class="skip-btn" onclick="skipChore()" id="skipBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                    Skip This Chore
                </button>
            </div>

            <div class="admin-link">
                <a href="/admin">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    Manage Chores
                </a>
            </div>
        </div>

        <div class="success-view" id="successView">
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20,6 9,17 4,12"/>
                </svg>
            </div>
            <div class="success-message">Nice one!</div>
            <div class="success-sub" id="successSub">Chore completed</div>
            <div class="close-hint">You can close this tab</div>
        </div>
    </div>

    <script>
        // CSRF protection: auto-inject X-Requested-With on state-changing requests
        (function() {
            const _origFetch = window.fetch;
            const CSRF_METHODS = new Set(['POST', 'PUT', 'DELETE', 'PATCH']);
            window.fetch = function(input, init) {
                if (init && CSRF_METHODS.has((init.method || 'GET').toUpperCase())) {
                    init.headers = init.headers || {};
                    if (init.headers instanceof Headers) {
                        if (!init.headers.has('X-Requested-With')) init.headers.set('X-Requested-With', 'XMLHttpRequest');
                    } else {
                        if (!init.headers['X-Requested-With']) init.headers['X-Requested-With'] = 'XMLHttpRequest';
                    }
                }
                return _origFetch.call(this, input, init);
            };
        })();

        const choreId = {{ chore.id }};
        let submitting = false;

        // Kiosk token from localStorage (set by kiosk.html)
        const KIOSK_TOKEN = (() => { try { return localStorage.getItem('huddle_kiosk_token') || ''; } catch(e) { return ''; } })();

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (KIOSK_TOKEN) headers['Authorization'] = 'Bearer ' + KIOSK_TOKEN;
            return headers;
        }

        function goBack() {
            if (history.length > 1) { history.back(); }
            else if (KIOSK_TOKEN) { window.location.href = '/kiosk?token=' + encodeURIComponent(KIOSK_TOKEN); }
            else { window.location.href = '/'; }
        }

        function disableAllButtons() {
            document.querySelectorAll('.person-btn').forEach(b => b.disabled = true);
            document.getElementById('skipBtn').disabled = true;
        }

        function enableAllButtons() {
            document.querySelectorAll('.person-btn').forEach(b => b.disabled = false);
            document.getElementById('skipBtn').disabled = false;
        }

        async function complete(person) {
            if (submitting) return;
            submitting = true;

            // Show loading state
            const btn = document.getElementById(`btn-${person}`);
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span>';

            // Disable all buttons
            disableAllButtons();

            try {
                const response = await fetch(`/api/chores/${choreId}/complete`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ completed_by: person })
                });

                if (!response.ok) {
                    throw new Error('Failed to complete chore');
                }

                // Show success
                document.getElementById('selectView').style.display = 'none';
                document.getElementById('successView').style.display = 'flex';
                document.getElementById('successSub').textContent = `${person} completed this chore`;

                // Vibrate if supported
                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }

            } catch (error) {
                // Show error
                const errorEl = document.getElementById('errorMessage');
                errorEl.textContent = 'Something went wrong. Please try again.';
                errorEl.style.display = 'block';

                // Reset button
                btn.innerHTML = originalContent;
                enableAllButtons();
                submitting = false;
            }
        }

        async function skipChore() {
            if (submitting) return;
            submitting = true;

            // Show loading state
            const btn = document.getElementById('skipBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span> Skipping...';

            // Disable all buttons
            disableAllButtons();

            try {
                const response = await fetch(`/api/chores/${choreId}/skip`, {
                    method: 'POST',
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    throw new Error('Failed to skip chore');
                }

                // Show success with different message
                document.getElementById('selectView').style.display = 'none';
                document.getElementById('successView').style.display = 'flex';
                document.querySelector('.success-message').textContent = 'Skipped!';
                document.getElementById('successSub').textContent = 'This chore has been skipped';

                // Vibrate if supported
                if (navigator.vibrate) {
                    navigator.vibrate([50, 50, 50]);
                }

            } catch (error) {
                // Show error
                const errorEl = document.getElementById('errorMessage');
                errorEl.textContent = 'Something went wrong. Please try again.';
                errorEl.style.display = 'block';

                // Reset button
                btn.innerHTML = originalContent;
                enableAllButtons();
                submitting = false;
            }
        }
    </script>
</body>
</html>
